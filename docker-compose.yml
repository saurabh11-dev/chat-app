services:
  redis:
    image: redis:7.0.15-alpine
    container_name: geochat-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geochat-backend
    environment:
      REDIS_URL: "redis://redis:6379/1"
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy